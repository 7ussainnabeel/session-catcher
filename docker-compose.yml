services:
  postgres:
    image: postgres:16-alpine
    container_name: session_reserve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessionsecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-session_reserve}
    command: postgres -c max_connections=250
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-session_reserve}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: session_reserve_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: session_reserve_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:sessionsecretpassword123@postgres:5432/session_reserve}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET:-c38e4a9b2d8f1e5a7b3c6d9e0f4a8b2c1d5e7f9a3b6c8d0e2f4a7b9c1d3e5f7a}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_MINUTES=${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - MAX_WORKERS=${MAX_WORKERS:-40}
      - SCREENSHOTS_DIR=/app/shared/screenshots
      - PROFILES_DIR=/app/shared/browser-profiles
      - WORKER_HOST=worker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shared_data:/app/shared
      - ./hajj-session-queue-assistant:/app/hajj-session-queue-assistant:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: session_reserve_worker
    restart: unless-stopped
    ipc: host # Shared memory for Chromium headless stability
    shm_size: '4gb'
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:sessionsecretpassword123@postgres:5432/session_reserve}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-40}
      - MAX_WORKERS=${MAX_WORKERS:-40}
      - SCREENSHOTS_DIR=/app/shared/screenshots
      - PROFILES_DIR=/app/shared/browser-profiles
    volumes:
      - shared_data:/app/shared
      - ./hajj-session-queue-assistant:/app/hajj-session-queue-assistant:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, redis; r=redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0')); r.ping()\" && pgrep -f 'celery -A worker.celery_app worker' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: session_reserve_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - shared_data:/app/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  shared_data:
