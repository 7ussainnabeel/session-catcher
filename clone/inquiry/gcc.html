<main class="page-shell gcc-module__page" dir="rtl">
<header class="site-header">
  <div class="header-tools" aria-label="روابط الصفحة">
    <span class="header-user-label">الاستعلام للخليجيين</span>
    <span class="person-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2"></circle><path d="M5.5 20c.55-4.15 2.95-6.45 6.5-6.45s5.95 2.3 6.5 6.45"></path></svg></span>
    <a href="../home.html" class="header-home-link">الصفحة الرئيسية</a>
    <span class="home-icon" aria-hidden="true">⌂</span>
  </div>
  <div class="committee-brand" aria-label="اللجنة العليا لشؤون الحج والعمرة">
    <img class="committee-logo" src="../assets/hajj-committee-logo.webp" alt="اللجنة العليا لشؤون الحج والعمرة"/>
  </div>
</header>
<div class="red-divider"></div>
<section style="width:min(620px, 100% - 40px); margin:30px auto;">
  <h1 style="text-align:center; font-weight:700;">الاستعلام عن حالة الطلب لمواطني دول مجلس التعاون</h1>
  <div style="background:#fff; border:1px solid #d5d5d5; padding:24px; box-shadow:0 2px 8px #0000000f; margin-top:20px;">
    <form style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label style="display:block; font-weight:700; margin-bottom:4px;">الجنسية</label>
        <select style="width:100%; height:40px; padding:6px 10px; border:1px solid #ccc;">
          <option>سعودي</option>
          <option>إماراتي</option>
          <option>كويتي</option>
          <option>عماني</option>
          <option>قطري</option>
        </select>
      </div>
      <div>
        <label style="display:block; font-weight:700; margin-bottom:4px;">الرقم الوطني / المدني</label>
        <input type="text" placeholder="أدخل الرقم الوطني" style="width:100%; height:40px; padding:6px 10px; border:1px solid #ccc;" />
      </div>
      <div>
        <label style="display:block; font-weight:700; margin-bottom:4px;">رقم طلب التسجيل</label>
        <input type="text" placeholder="مثال: HJ-2026-12345" style="width:100%; height:40px; padding:6px 10px; border:1px solid #ccc;" />
      </div>
      <button type="button" id="btn_register" style="background:#c60a0a; color:#fff; font-weight:700; height:44px; border:0; cursor:pointer; font-size:1rem;">استعلام</button>
    </form>
  </div>
</section>
</main>
